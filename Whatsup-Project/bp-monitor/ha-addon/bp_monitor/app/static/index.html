<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP Monitor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #eef1f5; --border: #d9dee6;
    --text: #1c2330; --text-2: #5a6472; --text-3: #8a93a1;
    --accent: #273a80; --accent-2: #c4372f;
    --good: #1f8a4c; --warn: #b7791f; --bad: #c43a3a; --info: #2b6cb0;
    --radius: 12px; --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141b; --surface: #171d26; --surface-2: #1f2733; --border: #2a3340;
      --text: #e8ecf1; --text-2: #a5afbc; --text-3: #6f7a88;
      --good: #4fcf84; --warn: #e0a940; --bad: #ef6b6b; --info: #6aa9f0;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .sub { color: var(--text-2); font-size: 13px; }
  header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .pill.on .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pill.err .dot { background: var(--bad); }
  .pill.wait .dot { background: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 820px) { .grid { grid-template-columns: 300px 1fr; } }

  .steps { padding: 16px; }
  .steps h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 0 0 12px; font-weight: 600; }
  .step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); align-items: start; }
  .step:last-child { border-bottom: 0; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); color: var(--text-3); font-size: 12px; display: grid; place-items: center; font-weight: 600; }
  .step .t { font-weight: 600; color: var(--text-3); }
  .step .d { color: var(--text-3); font-size: 12.5px; display: none; }
  .step.done .n { background: var(--good); border-color: var(--good); color: #fff; }
  .step.done .t { color: var(--text-2); }
  .step.active .n { border-color: var(--accent-2); color: var(--accent-2); animation: pulse 1.4s ease-in-out infinite; }
  .step.active .t { color: var(--text); }
  .step.active .d { display: block; color: var(--text-2); margin-top: 2px; }
  .step.active.error .n { border-color: var(--bad); color: var(--bad); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent-2) 40%, transparent);} 50% { box-shadow: 0 0 0 6px transparent;} }
  .detail { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); color: var(--text-2); font-size: 12.5px; min-height: 38px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--text-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { padding: 14px 16px; text-align: center; }
  .tile .k { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .tile .v { font-size: 36px; font-weight: 700; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tile .u { font-size: 13px; color: var(--text-2); font-weight: 500; margin-left: 4px; }
  .lastread { padding: 12px 16px; color: var(--text-2); font-size: 12.5px; }

  .history { padding: 16px; }
  .history h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; }
  .history h2 .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-3); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .empty { color: var(--text-3); padding: 8px; }
  .log { padding: 16px; }
  .log h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin: 0 0 10px; font-weight: 600; }
  .log pre { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-2); max-height: 180px; overflow: auto; white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12.5px; color: var(--text-2); margin-top: 10px; }
  .kv b { color: var(--text-3); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent-2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-6 3 12 3-9 2 3h6"/></svg>
    <div><h1>BP Monitor</h1><div class="sub">RBP1711150377 · <span id="devinfo">—</span></div></div>
    <div class="spacer"></div>
    <span class="pill" id="pill-conn"><span class="dot"></span><span>Disconnected</span></span>
    <span class="pill" id="pill-src"><span class="dot"></span><span>Source: none</span></span>
  </header>

  <div class="grid">
    <aside class="card steps">
      <h2>Guided connection</h2>
      <div id="steps"></div>
      <div class="detail" id="detail">Waiting for the add-on…</div>
      <div class="actions">
        <button class="primary" id="btn-start">Start</button>
        <button id="btn-stop">Stop Bluetooth</button>
        <button id="btn-reconnect">Reconnect</button>
      </div>
      <div class="kv">
        <b>Attempts</b><span id="attempts">0</span>
        <b>Readings</b><span id="readings">0</span>
        <b>Unrecognized frames</b><span id="unknown">0</span>
        <b>Uptime</b><span id="uptime">—</span>
      </div>
    </aside>

    <main style="display:grid; gap:16px; min-width:0">
      <div class="tiles">
        <div class="card tile"><div class="k">Systolic</div><div class="v"><span id="sys">--</span><span class="u">mmHg</span></div></div>
        <div class="card tile"><div class="k">Diastolic</div><div class="v"><span id="dia">--</span><span class="u">mmHg</span></div></div>
        <div class="card tile"><div class="k">Pulse</div><div class="v"><span id="pulse">--</span><span class="u">bpm</span></div></div>
      </div>
      <div class="card lastread">Last reading: <b id="lastread">—</b></div>

      <div class="card history">
        <h2>Reading history <span class="spacer"></span><button id="btn-refresh" style="font-weight:500;font-size:12px;padding:4px 10px">Refresh</button></h2>
        <div id="hist"><div class="empty">No readings yet.</div></div>
      </div>

      <div class="card log">
        <h2>Event log</h2>
        <pre id="log"></pre>
      </div>
    </main>
  </div>
</div>

<script>
(() => {
  const base = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/[^/]*$/, '');
  const api = p => base + 'api/' + p;
  const STEPS = ['wake','scanning','connecting','checking','ready','result'];
  const LABELS = {wake:'Turn on cuff', scanning:'Scanning', connecting:'Connecting', checking:'Checking device', ready:'Ready for measurement', result:'Reading received'};
  const $ = id => document.getElementById(id);

  const stepsEl = $('steps');
  stepsEl.innerHTML = STEPS.map((s,i) => `<div class="step" data-s="${s}"><div class="n">${i+1}</div><div><div class="t">${LABELS[s]}</div><div class="d"></div></div></div>`).join('');

  let status = null;
  function fmtTime(ts) { if (!ts) return '—'; const d = new Date(ts*1000); return d.toLocaleString(); }
  function renderStatus(st) {
    status = st;
    const idx = st.step_index;
    const err = st.step === 'error';
    const mqttWait = st.step === 'mqtt_wait';
    document.querySelectorAll('.step').forEach((el,i) => {
      el.classList.toggle('done', idx >= 0 ? i < idx : false);
      el.classList.toggle('active', (idx >= 0 && i === idx) || (err && i === 0) || (mqttWait && i === 3) || (st.step==='idle' && i===0));
      el.classList.toggle('error', err && i === 0);
      el.querySelector('.d').textContent = (i === idx || (err&&i===0) || (mqttWait&&i===3) || (st.step==='idle'&&i===0)) ? st.hint : '';
    });
    $('detail').textContent = (st.title ? st.title + (st.detail ? ' — ' + st.detail : '') : '') || 'Waiting…';
    $('attempts').textContent = st.attempts; $('readings').textContent = st.readings_count; $('unknown').textContent = st.unknown_frames;
    $('uptime').textContent = fmtDur(st.uptime_s);
    $('sys').textContent = st.systolic ?? '--'; $('dia').textContent = st.diastolic ?? '--'; $('pulse').textContent = st.pulse ?? '--';
    $('lastread').textContent = fmtTime(st.reading_time);
    const pc = $('pill-conn'); pc.className = 'pill ' + (st.connected ? 'on' : (err ? 'err' : 'wait'));
    pc.lastElementChild.textContent = st.connected ? 'Connected' : (st.step === 'idle' ? 'Stopped' : st.title || 'Disconnected');
    const ps = $('pill-src'); ps.className = 'pill ' + (st.source !== 'none' ? 'on' : ''); ps.lastElementChild.textContent = 'Source: ' + st.source;
    $('devinfo').textContent = [st.manufacturer, st.model, st.firmware && ('FW ' + st.firmware), st.address].filter(Boolean).join(' · ') || '—';
    $('log').textContent = (st.log || []).slice().reverse().join('\n');
    if (st.step === 'result') loadHistory();
  }
  function fmtDur(s) { if (s == null) return '—'; s = Math.round(s); return s < 60 ? s + ' s' : s < 3600 ? Math.floor(s/60) + 'm ' + (s%60) + 's' : Math.floor(s/3600) + 'h ' + Math.floor(s%3600/60) + 'm'; }

  let ws;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    ws = new WebSocket(proto + location.host + api('ws'));
    ws.onmessage = ev => { const m = JSON.parse(ev.data); if (m.type === 'status') renderStatus(m.data); };
    ws.onclose = () => { $('detail').textContent = 'Lost connection to add-on — reconnecting…'; setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
  }
  connect();
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 15000);

  const post = a => fetch(api('control/' + a), {method:'POST'}).then(r => r.json()).then(j => j.status && renderStatus(j.status)).catch(()=>{});
  $('btn-start').onclick = () => post('ble_start');
  $('btn-stop').onclick = () => post('ble_stop');
  $('btn-reconnect').onclick = () => post('reconnect');
  $('btn-refresh').onclick = loadHistory;

  function loadHistory() {
    fetch(api('history')).then(r => r.json()).then(list => {
      const el = $('hist');
      if (!list.length) { el.innerHTML = '<div class="empty">No readings yet.</div>'; return; }
      el.innerHTML = '<table><thead><tr><th>When</th><th>Systolic</th><th>Diastolic</th><th>Pulse</th></tr></thead><tbody>' +
        list.map(r => `<tr><td>${fmtTime(r.ts)}</td><td>${r.systolic}</td><td>${r.diastolic}</td><td>${r.pulse}</td></tr>`).join('') + '</tbody></table>';
    }).catch(()=>{});
  }
  loadHistory();
})();
</script>
</body>
</html>
