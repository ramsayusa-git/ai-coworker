<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Loqio">
  <defs>
    <linearGradient id="lq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#lq)"/>
  <!-- The mark is a speech bubble whose tail doubles as the descender of a lowercase
       "q" — the letter that makes the name legible at 16px, and the shape that says
       "messaging" without another generic chat icon. -->
  <circle cx="13.4" cy="13.2" r="6.1" fill="none" stroke="#ffffff" stroke-width="3.2"/>
  <path d="M19.5 12.4 L19.5 25.4" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
