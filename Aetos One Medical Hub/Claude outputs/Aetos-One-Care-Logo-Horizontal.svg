<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="careGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo circle on left -->
  <circle cx="60" cy="60" r="50" fill="url(#careGradient2)" filter="url(#shadow2)"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>

  <!-- Pulse + Cross inside circle -->
  <g opacity="0.95">
    <line x1="60" y1="30" x2="60" y2="90" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="35" y1="60" x2="85" y2="60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 48 60 Q 44 48 40 60" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M 80 60 Q 84 48 88 60" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text beside logo -->
  <text x="130" y="70" font-size="42" font-weight="700" fill="#0066cc" font-family="Arial, sans-serif" letter-spacing="1">
    Aetos One Care
  </text>
  <text x="130" y="95" font-size="12" fill="#666" font-family="Arial, sans-serif" letter-spacing="0.5">
    Medical Hub Platform
  </text>
</svg>
