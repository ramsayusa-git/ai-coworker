<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="careGradient6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow6" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Badge shape with circle and banner -->
  <circle cx="100" cy="100" r="80" fill="url(#careGradient6)" filter="url(#shadow6)"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Ribbon banner at bottom -->
  <path d="M 40 160 L 160 160 L 155 190 L 100 200 L 45 190 Z" fill="#0052a3" filter="url(#shadow6)"/>

  <!-- Pulse + Cross inside circle -->
  <g opacity="0.95">
    <line x1="100" y1="40" x2="100" y2="140" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="90" x2="155" y2="90" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 90 Q 65 72 60 90" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 130 90 Q 135 72 140 90" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Banner text -->
  <text x="100" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">AOC</text>
</svg>
