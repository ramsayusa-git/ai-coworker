<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="careGradient5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6e40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow5" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Red gradient - classic medical/heart symbol -->
  <circle cx="100" cy="100" r="95" fill="url(#careGradient5)" filter="url(#shadow5)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Pulse + Cross -->
  <g opacity="0.95">
    <line x1="100" y1="50" x2="100" y2="150" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="55" y1="100" x2="145" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M 75 100 Q 70 85 65 100" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 125 100 Q 130 85 135 100" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="100" y="175" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif" letter-spacing="2">AOC</text>
</svg>
