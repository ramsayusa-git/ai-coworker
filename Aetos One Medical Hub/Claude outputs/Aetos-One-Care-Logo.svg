<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="careGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#careGradient)" filter="url(#shadow)"/>

  <!-- Outer ring accent -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Central heartbeat/care symbol: Pulse line forming a circle -->
  <g opacity="0.95">
    <!-- Stylized heartbeat pulse that also forms a health cross -->

    <!-- Vertical line (care axis) -->
    <line x1="100" y1="50" x2="100" y2="150" stroke="white" stroke-width="3" stroke-linecap="round"/>

    <!-- Horizontal line (life axis) -->
    <line x1="55" y1="100" x2="145" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>

    <!-- Heartbeat pulse curve - left side -->
    <path d="M 75 100 Q 70 85 65 100" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Heartbeat pulse curve - right side -->
    <path d="M 125 100 Q 130 85 135 100" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AOC Text - positioned below the logo -->
  <text x="100" y="175" font-size="20" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif" letter-spacing="2">AOC</text>

  <!-- Small accent dots at cardinal points -->
  <circle cx="100" cy="30" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="170" cy="100" r="2.5" fill="white" opacity="0.6"/>
</svg>
