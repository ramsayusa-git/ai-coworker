<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-ripple-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-ripple-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad-ripple-pro)" filter="url(#shadow-ripple-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Concentric ripple waves -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="white" stroke-width="2.5" opacity="0.95"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>

  <!-- Central cross - care radiating outward -->
  <line x1="100" y1="65" x2="100" y2="45" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <line x1="135" y1="100" x2="155" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <line x1="100" y1="135" x2="100" y2="155" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <line x1="65" y1="100" x2="45" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

  <!-- Center point -->
  <circle cx="100" cy="100" r="4" fill="white" opacity="0.95"/>
</svg>
