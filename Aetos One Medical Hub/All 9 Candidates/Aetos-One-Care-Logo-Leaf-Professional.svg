<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-leaf-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26d07c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-leaf-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad-leaf-pro)" filter="url(#shadow-leaf-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Leaf shape - wellness symbol -->
  <path d="M 100 40 Q 75 70 75 100 Q 75 135 100 160 Q 125 135 125 100 Q 125 70 100 40"
        fill="white" opacity="0.95"/>

  <!-- Center vein -->
  <path d="M 100 40 Q 100 70 100 160" stroke="white" stroke-width="2" opacity="0.6"/>

  <!-- Left side veins -->
  <path d="M 85 58 Q 80 75 82 92" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <path d="M 80 75 Q 75 90 78 105" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <path d="M 82 92 Q 78 110 82 130" stroke="white" stroke-width="1.5" opacity="0.5"/>

  <!-- Right side veins -->
  <path d="M 115 58 Q 120 75 118 92" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <path d="M 120 75 Q 125 90 122 105" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <path d="M 118 92 Q 122 110 118 130" stroke="white" stroke-width="1.5" opacity="0.5"/>
</svg>
