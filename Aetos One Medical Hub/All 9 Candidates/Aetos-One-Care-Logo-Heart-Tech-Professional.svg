<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-heart-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-heart-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(grad-heart-pro)" filter="url(#shadow-heart-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Clinical heart shape - professional proportions -->
  <!-- Left lobe -->
  <circle cx="80" cy="85" r="22" fill="white" opacity="0.95"/>
  <!-- Right lobe -->
  <circle cx="120" cy="85" r="22" fill="white" opacity="0.95"/>
  <!-- Bottom point -->
  <path d="M 80 107 L 100 133 L 120 107 Z" fill="white" opacity="0.95"/>

  <!-- Tech circuit - minimal, clean lines -->
  <line x1="100" y1="55" x2="100" y2="72" stroke="#0066cc" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <line x1="100" y1="72" x2="85" y2="80" stroke="#0066cc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="72" x2="115" y2="80" stroke="#0066cc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="130" x2="100" y2="145" stroke="#0066cc" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Tech nodes (minimal) -->
  <circle cx="100" cy="55" r="2.5" fill="#0066cc" opacity="0.8"/>
  <circle cx="85" cy="80" r="2" fill="#0066cc" opacity="0.6"/>
  <circle cx="115" cy="80" r="2" fill="#0066cc" opacity="0.6"/>
  <circle cx="100" cy="145" r="2.5" fill="#0066cc" opacity="0.8"/>
</svg>
