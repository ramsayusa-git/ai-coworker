<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-dna-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-dna-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(grad-dna-pro)" filter="url(#shadow-dna-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- DNA double helix - precise, scientific -->
  <!-- Left strand -->
  <path d="M 80 45 Q 70 62 80 80 Q 90 98 80 115 Q 70 132 80 155"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- Right strand -->
  <path d="M 120 45 Q 130 62 120 80 Q 110 98 120 115 Q 130 132 120 155"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <!-- Connecting rungs - professional spacing -->
  <line x1="80" y1="62" x2="120" y2="62" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="80" y1="98" x2="120" y2="98" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <line x1="80" y1="132" x2="120" y2="132" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.85"/>

  <!-- Central stability spine -->
  <line x1="100" y1="45" x2="100" y2="155" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
</svg>
