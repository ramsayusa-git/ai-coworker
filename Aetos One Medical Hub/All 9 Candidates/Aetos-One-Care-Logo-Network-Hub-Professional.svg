<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-network-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-network-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad-network-pro)" filter="url(#shadow-network-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Central hub -->
  <circle cx="100" cy="100" r="18" fill="white" opacity="0.95"/>

  <!-- Connected nodes (8 positions for connectivity) -->
  <circle cx="100" cy="50" r="12" fill="white" opacity="0.85"/>
  <circle cx="150" cy="65" r="12" fill="white" opacity="0.85"/>
  <circle cx="165" cy="110" r="12" fill="white" opacity="0.85"/>
  <circle cx="150" cy="155" r="12" fill="white" opacity="0.85"/>
  <circle cx="100" cy="170" r="12" fill="white" opacity="0.85"/>
  <circle cx="50" cy="155" r="12" fill="white" opacity="0.85"/>
  <circle cx="35" cy="110" r="12" fill="white" opacity="0.85"/>
  <circle cx="50" cy="65" r="12" fill="white" opacity="0.85"/>

  <!-- Connection lines from center -->
  <line x1="100" y1="100" x2="100" y2="62" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="138" y2="77" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="153" y2="110" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="138" y2="143" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="100" y2="158" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="62" y2="143" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="47" y2="110" stroke="white" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="100" x2="62" y2="77" stroke="white" stroke-width="2" opacity="0.7"/>

  <!-- Central cross symbol (telemedicine indicator) -->
  <line x1="100" y1="95" x2="100" y2="105" stroke="#0066cc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="95" y1="100" x2="105" y2="100" stroke="#0066cc" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
