<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-shield-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-shield-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shield shape - protective, formal -->
  <path d="M 100 20 L 55 50 L 55 130 Q 100 180 100 180 Q 100 180 145 130 L 145 50 Z"
        fill="url(grad-shield-pro)" filter="url(#shadow-shield-pro)"/>

  <!-- Inner border for depth -->
  <path d="M 100 30 L 63 57 L 63 130 Q 100 172 100 172 Q 100 172 137 130 L 137 57 Z"
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>

  <!-- Medical cross - strict, centered, confident -->
  <line x1="100" y1="80" x2="100" y2="130" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <line x1="75" y1="105" x2="125" y2="105" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
</svg>
