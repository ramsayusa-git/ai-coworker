<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-ecg-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6e40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-ecg-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad-ecg-pro)" filter="url(#shadow-ecg-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- ECG waveform - heartbeat pattern -->
  <path d="M 30 100 L 50 100 L 60 80 L 70 120 L 80 100 L 90 100 L 100 95 L 110 90 L 120 95 L 130 100 L 140 100 L 150 75 L 160 125 L 170 100 L 185 100"
        fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Start point marker -->
  <circle cx="30" cy="100" r="3.5" fill="white" opacity="0.9"/>

  <!-- End point marker -->
  <circle cx="185" cy="100" r="3.5" fill="white" opacity="0.9"/>

  <!-- Grid reference lines (subtle) -->
  <line x1="50" y1="85" x2="50" y2="115" stroke="white" stroke-width="0.5" opacity="0.3"/>
  <line x1="100" y1="85" x2="100" y2="115" stroke="white" stroke-width="0.5" opacity="0.3"/>
  <line x1="150" y1="85" x2="150" y2="115" stroke="white" stroke-width="0.5" opacity="0.3"/>
</svg>
