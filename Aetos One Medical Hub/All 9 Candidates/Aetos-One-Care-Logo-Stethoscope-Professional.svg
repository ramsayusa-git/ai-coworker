<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-steth-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle - deeper, professional blue -->
  <circle cx="100" cy="100" r="95" fill="url(grad-steth-pro)" filter="url(#shadow-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Stethoscope - minimalist, clinical -->
  <!-- Top earpieces -->
  <circle cx="72" cy="55" r="7" fill="white" opacity="0.95"/>
  <circle cx="128" cy="55" r="7" fill="white" opacity="0.95"/>

  <!-- Connecting tube at top -->
  <path d="M 72 55 Q 100 35 128 55" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Left tube curving down -->
  <path d="M 72 62 Q 65 80 72 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Right tube curving down -->
  <path d="M 128 62 Q 135 80 128 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Main stem down to chest piece -->
  <path d="M 72 100 Q 100 115 100 130" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 128 100 Q 100 115 100 130" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Chest piece - large clinical circle -->
  <circle cx="100" cy="145" r="20" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <circle cx="100" cy="145" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
</svg>
