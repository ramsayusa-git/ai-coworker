<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-hand-pro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-hand-pro">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad-hand-pro)" filter="url(#shadow-hand-pro)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Helping hand - open palm supporting -->
  <!-- Wrist/arm -->
  <path d="M 70 140 Q 70 125 75 110" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9"/>

  <!-- Thumb -->
  <path d="M 75 110 Q 65 105 60 95" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Four fingers -->
  <path d="M 80 105 Q 80 75 78 55" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 92 100 Q 95 68 94 50" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 104 98 Q 108 65 110 48" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 116 100 Q 122 70 126 52" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Palm base -->
  <ellipse cx="95" cy="115" rx="18" ry="12" fill="white" opacity="0.9"/>

  <!-- Heart in center of palm -->
  <circle cx="90" cy="105" r="8" fill="white" opacity="0.95"/>
  <circle cx="100" cy="105" r="8" fill="white" opacity="0.95"/>
  <path d="M 85 115 L 95 125 L 105 115 Z" fill="white" opacity="0.95"/>
</svg>
