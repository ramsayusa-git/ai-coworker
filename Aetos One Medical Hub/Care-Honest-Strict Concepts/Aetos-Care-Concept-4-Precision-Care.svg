<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6e40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c4">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c4)" filter="url(#shadow-c4)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Target with care (precision in care) -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>

  <!-- Heart at center (care focused) -->
  <circle cx="90" cy="92" r="6" fill="white" opacity="0.95"/>
  <circle cx="110" cy="92" r="6" fill="white" opacity="0.95"/>
  <path d="M 85 105 L 100 120 L 115 105 Z" fill="white" opacity="0.95"/>

  <!-- Crosshair (honest/strict precision) -->
  <line x1="100" y1="75" x2="100" y2="65" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="125" y1="100" x2="135" y2="100" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
