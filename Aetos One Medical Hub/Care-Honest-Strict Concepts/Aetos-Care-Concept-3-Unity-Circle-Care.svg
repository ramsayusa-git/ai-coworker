<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d084;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c3">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c3)" filter="url(#shadow-c3)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Three overlapping circles (unity/care) -->
  <circle cx="75" cy="85" r="28" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <circle cx="125" cy="85" r="28" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>
  <circle cx="100" cy="125" r="28" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>

  <!-- Central plus (care/healing) -->
  <line x1="100" y1="90" x2="100" y2="110" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <line x1="90" y1="100" x2="110" y2="100" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.95"/>

  <!-- Connection points (honest/strict) -->
  <circle cx="75" cy="85" r="3" fill="white" opacity="0.9"/>
  <circle cx="125" cy="85" r="3" fill="white" opacity="0.9"/>
  <circle cx="100" cy="125" r="3" fill="white" opacity="0.9"/>
</svg>
