  <path d="M 50 110 L 100 80 L 150 110 Z" fill="none" stroke="white" stroke-width="3" opacity="0.85"/>
  <path d="M 40 140 L 100 110 L 160 140 Z" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>

  <!-- Heart in center (care) -->
