  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c10)" filter="url(#shadow-c10)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Three layer foundation (trust/honest/strict) -->
