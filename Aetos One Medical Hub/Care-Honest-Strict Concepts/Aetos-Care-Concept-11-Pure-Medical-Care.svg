<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6e40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c11">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c11)" filter="url(#shadow-c11)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Large medical cross (strict/honest) -->
  <line x1="100" y1="50" x2="100" y2="150" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

  <!-- Heart embedded in cross center (care) -->
  <circle cx="94" cy="96" r="5" fill="white" opacity="0.95"/>
  <circle cx="106" cy="96" r="5" fill="white" opacity="0.95"/>
  <path d="M 90 105 L 100 113 L 110 105 Z" fill="white" opacity="0.95"/>

  <!-- Corner dots (precision/honest) -->
  <circle cx="60" cy="60" r="2" fill="white" opacity="0.8"/>
  <circle cx="140" cy="60" r="2" fill="white" opacity="0.8"/>
  <circle cx="60" cy="140" r="2" fill="white" opacity="0.8"/>
  <circle cx="140" cy="140" r="2" fill="white" opacity="0.8"/>
</svg>
