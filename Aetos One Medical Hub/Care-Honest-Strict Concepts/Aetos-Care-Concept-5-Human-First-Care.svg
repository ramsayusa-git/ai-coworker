<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8e8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c5">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c5)" filter="url(#shadow-c5)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Human head/upper body (care for person) -->
  <circle cx="100" cy="70" r="20" fill="white" opacity="0.9"/>
  <path d="M 80 90 Q 80 105 90 115 L 110 115 Q 120 105 120 90 Z" fill="white" opacity="0.9"/>

  <!-- Heart over chest (care essence) -->
  <circle cx="95" cy="100" r="6" fill="white" opacity="0.95"/>
  <circle cx="105" cy="100" r="6" fill="white" opacity="0.95"/>
  <path d="M 90 110 L 100 120 L 110 110 Z" fill="white" opacity="0.95"/>

  <!-- Medical cross (honest/strict treatment) -->
  <line x1="100" y1="135" x2="100" y2="155" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <line x1="88" y1="145" x2="112" y2="145" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>
