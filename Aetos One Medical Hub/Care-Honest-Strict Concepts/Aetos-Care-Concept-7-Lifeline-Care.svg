<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6e40;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c7">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c7)" filter="url(#shadow-c7)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- ECG line forming heart shape -->
  <path d="M 30 100 L 50 100 L 60 85 L 75 115 L 90 100 L 100 95 L 110 100 L 125 130 L 140 75 L 170 100 L 190 100"
        fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Heart marker at peak (care moment) -->
  <circle cx="90" cy="88" r="6" fill="white" opacity="0.95"/>

  <!-- Base line (honest/strict monitoring) -->
  <line x1="30" y1="140" x2="190" y2="140" stroke="white" stroke-width="2" opacity="0.7"/>
</svg>
