<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d084;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c8">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c8)" filter="url(#shadow-c8)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Left healing hand -->
  <path d="M 55 110 Q 60 85 65 65 Q 68 55 72 50"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Right healing hand -->
  <path d="M 145 110 Q 140 85 135 65 Q 132 55 128 50"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Central healing light (care) -->
  <circle cx="100" cy="105" r="25" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="100" cy="105" r="15" fill="none" stroke="white" stroke-width="2" opacity="0.7"/>

  <!-- Heart center (care essence) -->
  <circle cx="95" cy="100" r="5" fill="white" opacity="0.95"/>
  <circle cx="105" cy="100" r="5" fill="white" opacity="0.95"/>
  <path d="M 90 110 L 100 118 L 110 110 Z" fill="white" opacity="0.95"/>

  <!-- Base (honest/strict foundation) -->
  <line x1="70" y1="150" x2="130" y2="150" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
