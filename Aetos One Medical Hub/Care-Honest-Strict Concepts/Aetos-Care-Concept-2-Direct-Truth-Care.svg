<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003d82;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow-c2">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#grad-c2)" filter="url(#shadow-c2)"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <!-- Upward arrow (honest truth) -->
  <path d="M 100 160 L 100 60" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 100 60 L 85 80 M 100 60 L 115 80" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- Heart at top (care) -->
  <circle cx="85" cy="50" r="7" fill="white" opacity="0.95"/>
  <circle cx="115" cy="50" r="7" fill="white" opacity="0.95"/>
  <path d="M 80 63 L 100 80 L 120 63 Z" fill="white" opacity="0.95"/>

  <!-- Medical cross base (strict) -->
  <line x1="100" y1="140" x2="100" y2="160" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="88" y1="150" x2="112" y2="150" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
