[project]
name = "aetos-core"
version = "2.0.0"
description = "Aetos Voice Core — console API, registries, event bus. Imports NO vendor SDK."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic>=2.8",
  "redis>=5.0", "httpx>=0.27", "pyyaml>=6", "python-multipart>=0.0.9",
  "alembic>=1.13", "argon2-cffi>=23", "pyjwt>=2.9", "pynacl>=1.5", "email-validator>=2",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["aetos_core*"]
