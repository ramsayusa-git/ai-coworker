[project]
name = "aetos-agent"
version = "1.0.0"
description = "Aetos agent worker — livekit-agents + ONE plugin (remote-provider adapter). No vendor SDKs."
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[silero,turn-detector,openai]~=1.8",   # openai plugin = OpenAI-compatible client for llm-gateway, not a vendor pin
  "grpcio>=1.66", "protobuf>=5.28", "httpx>=0.27", "pyyaml>=6", "redis>=5",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["aetos_agent*"]
