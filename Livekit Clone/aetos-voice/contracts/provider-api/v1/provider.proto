// provider-api v1 — the only thing the agent worker and a provider sidecar share.
// Rules: additive changes only within v1. Breaking change => v2 package, Core supports N and N-1.
syntax = "proto3";
package aetos.provider.v1;

// ---- audio ----
message AudioFrame {
  bytes  pcm16       = 1;  // little-endian 16-bit PCM, interleaved
  uint32 sample_rate = 2;  // 16000 or 24000
  uint32 channels    = 3;  // 1
  uint64 ts_ms       = 4;  // producer timestamp
}

// ---- speech to text ----
message SttConfig {
  string language    = 1;  // "en", "hi", "auto"
  string model       = 2;  // provider-specific, "" = default
  uint32 sample_rate = 3;
  bool   interim     = 4;  // emit interim hypotheses
  map<string,string> options = 5;
}
message SttRequest {
  oneof payload {
    SttConfig  config = 1;  // must be the first message
    AudioFrame frame  = 2;
    bool       flush  = 3;  // caller says: finalise now
  }
}
message SttEvent {
  enum Kind { INTERIM = 0; FINAL = 1; END_OF_TURN = 2; ERROR = 3; }
  Kind   kind       = 1;
  string text       = 2;
  float  confidence = 3;
  string language   = 4;
  uint64 ts_ms      = 5;
  string error      = 6;
}
service Stt { rpc Stream(stream SttRequest) returns (stream SttEvent); }

// ---- text to speech ----
message TtsConfig {
  string voice       = 1;
  string model       = 2;
  uint32 sample_rate = 3;
  float  speed       = 4;  // 1.0 = normal
  map<string,string> options = 5;
}
message TtsRequest {
  oneof payload {
    TtsConfig config = 1;   // must be the first message
    string    text   = 2;   // text chunks stream in as the LLM emits them
    bool      flush  = 3;   // end of utterance
  }
}
service Tts { rpc Synthesize(stream TtsRequest) returns (stream AudioFrame); }

// ---- every provider ----
message Empty {}
message HealthStatus {
  enum State { READY = 0; DEGRADED = 1; DOWN = 2; LOADING = 3; }
  State  state  = 1;
  string detail = 2;
}
message Caps {
  repeated string languages    = 1;
  repeated string voices       = 2;
  repeated uint32 sample_rates = 3;
  bool            streaming    = 4;
  map<string,string> extra     = 5;
}
message VersionInfo {
  string name    = 1;   // tts-kokoro
  string version = 2;   // engine version
  string sdk     = 3;   // wrapped SDK / engine pin
  string model   = 4;   // model artifact version
  repeated uint32 contracts = 5;  // provider-api majors supported
}
service Provider {
  rpc Health(Empty)       returns (HealthStatus);
  rpc Capabilities(Empty) returns (Caps);
  rpc Version(Empty)      returns (VersionInfo);
}
