<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,system-ui,sans-serif}
  #wrap{position:relative;height:100vh;width:100vw;background:linear-gradient(120deg,#F4F8FF 0%,#EAF1FC 55%,#F3ECFB 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  .waves{position:absolute;left:0;bottom:0;width:100%;height:46%;pointer-events:none}
  .waves path{opacity:.5}
  .w1{animation:drift 14s linear infinite}
  .w2{animation:drift 22s linear infinite reverse}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-33.33%)}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 26px;z-index:3}
  .greet{font-size:24px;font-weight:600;color:#1B2340;line-height:1.1;letter-spacing:.2px}
  .sub{font-size:13px;color:#6A76A0;margin-top:5px}
  .clock{font-size:36px;font-weight:700;color:#273A80;line-height:1;font-variant-numeric:tabular-nums}
  .date{font-size:12px;color:#7A86AE;margin-top:3px;text-align:right}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1D9E75;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 0 rgba(29,158,117,.5);animation:beat 2.4s ease-out infinite}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(29,158,117,.45)}70%{box-shadow:0 0 0 7px rgba(29,158,117,0)}100%{box-shadow:0 0 0 0 rgba(29,158,117,0)}}
</style></head><body>
<div id="wrap">
  <canvas id="net"></canvas>
  <svg class="waves" viewBox="0 0 1200 200" preserveAspectRatio="none">
    <path class="w1" d="M0,90 C150,140 350,40 600,90 C850,140 1050,40 1200,90 C1350,140 1550,40 1800,90 L1800,200 L0,200 Z" fill="#273A80"/>
    <path class="w2" d="M0,120 C200,80 400,160 600,120 C800,80 1000,160 1200,120 C1400,80 1600,160 1800,120 L1800,200 L0,200 Z" fill="#E6701C"/>
  </svg>
  <div class="overlay">
    <div><div class="greet" id="greet">Good evening</div><div class="sub"><span class="dot"></span>3 lights on &middot; doors locked &middot; all systems normal</div></div>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
  </div>
</div>
<script>
(function(){
  var c=document.getElementById('net'),x=c.getContext('2d'),W,H,pts=[];
  function size(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight;}
  size();window.addEventListener('resize',size);
  var N=Math.max(14,Math.min(30,Math.floor(W/38)));
  for(var i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H*0.85,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:1.5+Math.random()*2});
  function step(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){var p=pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H*0.9)p.vy*=-1;}
    for(var i=0;i<pts.length;i++)for(var j=i+1;j<pts.length;j++){
      var a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){x.strokeStyle='rgba(39,58,128,'+(0.14*(1-d/120))+')';x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
    }
    for(var i=0;i<pts.length;i++){var p=pts[i];x.fillStyle=i%5===0?'rgba(230,112,28,.85)':'rgba(39,58,128,.65)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}
    requestAnimationFrame(step);
  }
  step();
  function tick(){var d=new Date();var h=d.getHours();
    document.getElementById('greet').textContent = h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
    document.getElementById('clock').textContent = String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    document.getElementById('date').textContent = d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  }
  tick();setInterval(tick,10000);
})();
</script>
</body></html>
